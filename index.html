<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конфигуратор ПК</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --bg-input: #f1f5f9;
      --border: #2ea043;
      --border-subtle: rgba(46, 160, 67, 0.4);
      --accent: #2ea043;
      --accent-hover: #238636;
      --text: #1e293b;
      --text-bright: #0f172a;
      --text-muted: #64748b;
      --success: #238636;
      --warning: #b45309;
      --danger: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text);
      min-height: 100vh;
      padding: 25px 15px;
      display: flex;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
    }

    /* АНИМИРОВАННЫЙ ФОН С ЛЕТАЮЩИМИ КОМПОНЕНТАМИ */
    .bg-particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .floating-item {
      position: absolute;
      opacity: 0.16;
      animation: floatMotion 18s ease-in-out infinite alternate;
    }

    .cpu-item {
      filter: blur(4px);
    }

    .gpu-item {
      filter: blur(6px);
    }

    /* Индивидуальные позиции и параметры анимации */
    .pos-1 { top: 8%; left: 6%; animation-duration: 22s; animation-delay: 0s; }
    .pos-2 { top: 65%; left: 8%; animation-duration: 26s; animation-delay: -3s; }
    .pos-3 { top: 15%; right: 8%; animation-duration: 20s; animation-delay: -5s; }
    .pos-4 { top: 55%; right: 6%; animation-duration: 24s; animation-delay: -2s; }
    .pos-5 { top: 85%; left: 35%; animation-duration: 28s; animation-delay: -7s; }
    .pos-6 { top: 35%; right: 28%; animation-duration: 25s; animation-delay: -4s; }

    @keyframes floatMotion {
      0% {
        transform: translateY(0) rotate(0deg) scale(1);
      }
      50% {
        transform: translateY(-45px) rotate(14deg) scale(1.05);
      }
      100% {
        transform: translateY(35px) rotate(-10deg) scale(0.95);
      }
    }

    .wrapper {
      width: 100%;
      max-width: 900px;
      position: relative;
      z-index: 1;
    }

    header {
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 16px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-bright);
      margin-bottom: 6px;
    }

    p.desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .tab-btn.active {
      background: var(--bg-card);
      color: var(--accent);
      border-color: var(--border);
      box-shadow: 0 2px 6px rgba(46, 160, 67, 0.15);
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .grid-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    select, input {
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      color: var(--text-bright);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    select:focus, input:focus {
      border-color: var(--border);
      box-shadow: 0 0 0 2px rgba(46, 160, 67, 0.2);
    }

    .btn-submit {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      box-shadow: 0 2px 8px rgba(46, 160, 67, 0.25);
    }

    .btn-submit:hover {
      background: var(--accent-hover);
    }

    .specs-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 0.9rem;
    }

    .specs-table th, .specs-table td {
      border: 1px solid var(--border-subtle);
      padding: 10px 12px;
      text-align: left;
    }

    .specs-table th {
      background: rgba(46, 160, 67, 0.06);
      color: var(--text-bright);
      font-weight: 600;
      width: 25%;
    }

    .specs-table td {
      color: var(--text);
    }

    .result-section {
      display: none;
      margin-top: 20px;
      border-top: 1px solid var(--border-subtle);
      padding-top: 20px;
    }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .result-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-bright);
    }

    .tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      padding: 6px 12px;
      border-radius: 4px;
      font-weight: 700;
    }

    .tag-ok { background: rgba(35, 134, 54, 0.12); color: #1e702c; border: 1px solid var(--border); }
    .tag-warn { background: rgba(180, 83, 9, 0.12); color: var(--warning); border: 1px solid var(--warning); }
    .tag-danger { background: rgba(220, 38, 38, 0.12); color: var(--danger); border: 1px solid var(--danger); }

    .summary-text {
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.5;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      padding: 12px 14px;
      border-radius: 6px;
      margin-top: 12px;
    }

    .details-list {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .detail-item {
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      padding: 12px 14px;
      border-radius: 6px;
    }

    .detail-item h4 {
      font-size: 0.9rem;
      color: var(--text-bright);
      margin-bottom: 4px;
    }

    .detail-item p {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
    }
  </style>
</head>

<div class="wrapper">
  <header>
    <h1>Конфигуратор ПК</h1>
    <p class="desc">Подбор оптимальной конфигурации под бюджет и анализ совместимости комплектующих.</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('budgetTab', this)">Подбор по бюджету</button>
    <button class="tab-btn" onclick="switchTab('upgradeTab', this)">Анализ баланса и апгрейда</button>
  </div>

  <!-- ВКЛАДКА 1: ПОДБОР ПО БЮДЖЕТУ -->
  <div id="budgetTab" class="card tab-content active">
    <div class="field" style="margin-bottom: 16px;">
      <label for="budgetInput">Сумма на системный блок (в рублях):</label>
      <input type="number" id="budgetInput" placeholder="Введите сумму" min="1000" step="1000" value="50000">
    </div>
    <button class="btn-submit" onclick="generateBuildByBudget()">Рассчитать конфигурацию</button>

    <div id="budgetResult" class="result-section">
      <div class="result-header">
        <div class="result-title" id="buildCategoryName">Бюджет: 0 ₽</div>
        <div class="tag tag-ok" id="buildPriceTag">0 ₽</div>
      </div>
      
      <table class="specs-table">
        <tbody>
          <tr><th>Процессор</th><td id="bCpu">-</td></tr>
          <tr><th>Охлаждение</th><td id="bCooler">-</td></tr>
          <tr><th>Материнская плата</th><td id="bMotherboard">-</td></tr>
          <tr><th>Видеокарта</th><td id="bGpu">-</td></tr>
          <tr><th>ОЗУ</th><td id="bRam">-</td></tr>
          <tr><th>Накопитель</th><td id="bStorage">-</td></tr>
          <tr><th>Блок питания</th><td id="bPsu">-</td></tr>
          <tr><th>Корпус</th><td id="bCase">-</td></tr>
        </tbody>
      </table>

      <div class="summary-text" id="buildNotes">Пояснение появится здесь.</div>
    </div>
  </div>

  <!-- ВКЛАДКА 2: АНАЛИЗ БАЛАНСА -->
  <div id="upgradeTab" class="card tab-content">
    <div class="grid-form">
      <div class="field">
        <label for="cCpu">Процессор:</label>
        <select id="cCpu">
          <option value="legacy">LGA 775 (Core 2 Quad) / Athlon II / Phenom II</option>
          <option value="fx_series">AMD FX-4300 / FX-6300 / FX-8350 (AM3+)</option>
          <option value="intel_lga1155">Core i5-2500 / i5-3570 / i7-3770 (LGA 1155)</option>

          <option value="ryzen_zen1">AMD Ryzen 5 1600 / 2600 (AM4)</option>
          <option value="intel_mid_old">Core i3-10100F / i3-12100F / i5-10400F</option>
          <option value="ryzen_am4_main" selected>AMD Ryzen 5 3600 / Ryzen 5 5500 / Ryzen 5 5600</option>
          <option value="intel_lga1700">Intel Core i5-12400F / i5-13400F / i5-14400F</option>
          <option value="ryzen_am4_top">AMD Ryzen 7 5700X3D / 5800X3D (AM4)</option>
          <option value="am5_base">AMD Ryzen 5 7500F / Ryzen 5 7600 (AM5)</option>
          <option value="am5_intel_top">AMD Ryzen 7 7800X3D / Core i7-14700K</option>
        </select>
      </div>

      <div class="field">
        <label for="cGpu">Видеокарта:</label>
        <select id="cGpu">
          <option value="gpu_retro">Встроенное видео / GT 710 / GT 730</option>
          <option value="gpu_budget_low">GTX 650 / GTX 750 Ti / HD 7770 / GT 1030</option>
          <option value="gpu_budget_old">GTX 950 / GTX 960 / GTX 1050 Ti</option>
          <option value="gpu_polaris" selected>RX 580 8GB (2048SP) / GTX 1060 6GB</option>
          <option value="gpu_entry">GTX 1660 Super / GTX 1660 Ti / RTX 2060 6GB</option>
          <option value="gpu_mid">Radeon RX 6600 8GB / RTX 3060 12GB / RTX 4060 8GB</option>
          <option value="gpu_mid_high">RTX 4060 Ti / RX 6700 XT / RX 7700 XT 12GB</option>
          <option value="gpu_high">RTX 4070 / RTX 4070 Super 12GB / RX 7800 XT 16GB</option>
          <option value="gpu_enthusiast">RTX 4080 Super 16GB / RX 7900 XT</option>
          <option value="gpu_top">GeForce RTX 4090 24GB</option>
        </select>
      </div>

      <div class="field">
        <label for="cRam">Оперативная память:</label>
        <select id="cRam">
          <option value="4">4 ГБ (DDR2 / DDR3)</option>
          <option value="8">8 ГБ (Single Channel)</option>
          <option value="8_dual">8 ГБ (2x4 ГБ Dual)</option>
          <option value="16" selected>16 ГБ (2x8 ГБ Dual)</option>
          <option value="32">32 ГБ (2x16 ГБ Dual)</option>
          <option value="64">64 ГБ и более</option>
        </select>
      </div>

      <div class="field">
        <label for="cPsu">Мощность БП (Вт):</label>
        <input type="number" id="cPsu" value="700" step="50">
      </div>
    </div>

    <button class="btn-submit" onclick="analyzeConfiguration()">Проверить конфигурацию</button>

    <div id="upgradeResult" class="result-section">
      <div class="result-header">
        <div class="result-title" id="analysisTitle">Результат анализа</div>
        <div class="tag" id="analysisTag">Статус</div>
      </div>
      <div class="details-list" id="analysisDetails"></div>
    </div>
  </div>
</div>

    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
  }

  function generateBuildByBudget() {
    const budget = parseInt(document.getElementById('budgetInput').value) || 0;
    const resBox = document.getElementById('budgetResult');

    if (budget < 1000) {
      alert("Введите бюджет от 1 000 рублей.");
      return;
    }

    let selectedBuild = buildsDatabase[0];
    let minDiff = Math.abs(budget - buildsDatabase[0].baseCost);

    for (let i = 1; i < buildsDatabase.length; i++) {
      const diff = Math.abs(budget - buildsDatabase[i].baseCost);
      if (diff < minDiff) {
        minDiff = diff;
        selectedBuild = buildsDatabase[i];
      }
    }

    const rangeLow = Math.round((budget * 0.96) / 500) * 500;
    const rangeHigh = Math.round((budget * 1.04) / 500) * 500;
    const tagText = `${rangeLow.toLocaleString('ru-RU')} - ${rangeHigh.toLocaleString('ru-RU')} ₽`;

    document.getElementById('buildCategoryName').textContent = "Бюджет: " + budget.toLocaleString('ru-RU') + " ₽";
    document.getElementById('buildPriceTag').textContent = tagText;
    
    document.getElementById('bCpu').textContent = selectedBuild.cpu;
    document.getElementById('bCooler').textContent = selectedBuild.cooler;
    document.getElementById('bMotherboard').textContent = selectedBuild.mb;
    document.getElementById('bGpu').textContent = selectedBuild.gpu;
    document.getElementById('bRam').textContent = selectedBuild.ram;
    document.getElementById('bStorage').textContent = selectedBuild.storage;
    document.getElementById('bPsu').textContent = selectedBuild.psu;
    document.getElementById('bCase').textContent = selectedBuild.case;
    document.getElementById('buildNotes').textContent = selectedBuild.notes;

    resBox.style.display = 'block';
  }

  const cpuPower = {
    legacy: 1, fx_series: 1, intel_lga1155: 2, xeon_v3: 2, ryzen_zen1: 2,
    intel_mid_old: 3, ryzen_am4_main: 4, intel_lga1700: 4,
    ryzen_am4_top: 5, am5_base: 5, am5_intel_top: 6
  };

  const gpuPower = {
    gpu_retro: 0, gpu_budget_low: 1, gpu_budget_old: 2, gpu_polaris: 2,
    gpu_entry: 3, gpu_mid: 4, gpu_mid_high: 5,
    gpu_high: 6, gpu_enthusiast: 7, gpu_top: 8
  };

  const tdpEstimate = {
    gpu_retro: 30, gpu_budget_low: 65, gpu_budget_old: 90, gpu_polaris: 160,
    gpu_entry: 125, gpu_mid: 160, gpu_mid_high: 220,
    gpu_high: 240, gpu_enthusiast: 320, gpu_top: 450
  };

  function analyzeConfiguration() {
    const cpu = document.getElementById('cCpu').value;
    const gpu = document.getElementById('cGpu').value;
    const ram = document.getElementById('cRam').value;
    const psu = parseInt(document.getElementById('cPsu').value) || 450;

    const cP = cpuPower[cpu];
    const gP = gpuPower[gpu];

    const resBox = document.getElementById('upgradeResult');
    const title = document.getElementById('analysisTitle');
    const tag = document.getElementById('analysisTag');
    const details = document.getElementById('analysisDetails');

    details.innerHTML = '';
    resBox.style.display = 'block';

    if (cP > gP + 1) {
      title.textContent = "Упор в видеокарту (GPU Bottleneck)";
      tag.textContent = "Требуется апгрейд GPU";
      tag.className = "tag tag-warn";
      addDetail("Потенциал процессора сдерживается видеокартой", 
        "Процессор способен обеспечить существенно более высокий фреймрейт. В требовательных играх видеокарта загружена на 99-100%, являясь сдерживающим звеном. Рекомендуется апгрейд видеокарты.");
    } else if (gP > cP + 1) {
      title.textContent = "Упор в процессор (CPU Bottleneck)";
      tag.textContent = "Требуется апгрейд CPU/Платформы";
      tag.className = "tag tag-danger";
      addDetail("Процессор сдерживает видеокарту", 
        "Производительности процессора недостаточно для полноценной загрузки видеокарты в современных играх. Возможны нестабильный фреймтайм, статтеры и резкие просадки FPS. Требуется замена процессора или платформы.");
    } else {
      title.textContent = "Сбалансированная связка";
      tag.textContent = "Баланс соблюден";
      tag.className = "tag tag-ok";
      addDetail("Компоненты подобраны оптимально", 
        "Производительность процессора и видеокарты находится в одном технологическом классе. Система выдает максимальный КПД на каждый затраченный рубль.");
    }

    if (ram === '4') {
      addDetail("Критический дефицит ОЗУ", 
        "4 ГБ недостаточно даже для комфортного серфинга. Windows будет непрерывно обращаться к файлу подкачки на диске. Необходим апгрейд минимум до 8-16 ГБ.");
    } else if (ram === '8') {
      addDetail("Одноканальный режим (Single Channel) и малый объем", 
        "8 ГБ в одноканале приводят к просадке пропускной способности памяти почти в два раза. Добавление второго модуля даст мгновенный прирост минимального фреймрейта.");
    } else if (ram === '8_dual') {
      addDetail("Двухканальный режим активен, объем на пределе", 
        "8 ГБ в двухканале достаточно для базовых и киберспортивных игр, но в тяжелых проектах данные сбрасываются в файл подкачки. Рекомендуется расширение до 16 ГБ.");
    } else if (ram === '16') {
      addDetail("ОЗУ: оптимальный стандарт для 1080p", 
        "16 ГБ в Dual Channel закрывают требования большинства современных игр. В будущем для тяжелых задач возможен апгрейд до 32 ГБ.");
    } else {
      addDetail("ОЗУ: полный запас", 
        "32 ГБ и более гарантируют полное отсутствие упора в оперативную память как в играх, так и в софте.");
    }

    const totalTdp = tdpEstimate[gpu] + (cP >= 5 ? 120 : 70) + 60;
    const minSafePsu = Math.ceil((totalTdp * 1.4) / 50) * 50;

    if (psu < totalTdp) {
      addDetail("Критическая нехватка мощности блока питания", 
        `Расчетная пиковая нагрузка конфигурации составляет около ${totalTdp} Вт, а номинал БП — ${psu} Вт. Высокий риск срабатывания защит (OCP/OPP) или отключения ПК под нагрузкой. Необходим блок от ${minSafePsu} Вт.`);
    } else if (psu >= 650 && totalTdp <= 330) {
      addDetail("Блок питания имеет отличный резерв мощности", 
        `Потребление текущей системы около ${totalTdp} Вт. Блок питания на ${psu} Вт обеспечивает солидный запас, работает в зоне высокого КПД и позволит установить более мощную видеокарту без замены БП.`);
    } else {
      addDetail("Мощность блока питания в норме", 
        `БП на ${psu} Вт полностью покрывает расчетное энергопотребление (~${totalTdp} Вт) с учетом необходимого резерва.`);
    }
  }

  function addDetail(heading, text) {
    const container = document.getElementById('analysisDetails');
    const div = document.createElement('div');
    div.className = 'detail-item';
    div.innerHTML = `<h4>${heading}</h4><p>${text}</p>`;
    container.appendChild(div);
  }
